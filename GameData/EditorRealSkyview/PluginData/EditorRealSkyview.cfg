// EditorRealSkyview — User Configuration
// ──────────────────────────────────────
// Edit values here to tune lighting and shadow appearance in the VAB/SPH.
// Lines starting with // are comments and are ignored by the loader.
// Delete this file to restore all defaults on next game start.
//
// Note: mod enable/disable, lighting toggle, shadow toggle, and capture
// resolution are saved per-save-game via the in-game Difficulty settings.

ERSV_CONFIG
{
    // ── Ambient Lighting ────────────────────────────────────────────────────
    //
    // These multipliers scale the gamma-lifted sky color sampled from the
    // captured cubemap and apply it to Unity's trilight ambient system.
    // 1.0 = full sky color brightness; lower values dim the contribution.

    // Surfaces facing upward: rooftops, craft tops, road surfaces.
    skyMultiplier = 1.0

    // Surfaces facing outward: building walls, fuselage sides.
    equatorMultiplier = 0.75

    // Surfaces facing downward: floors, craft undersides.
    groundMultiplier = 0.4

    // Per-channel brightness limit when averaging the sky cubemap face.
    // Prevents the sun disk from biasing the color sample when directly overhead.
    sunClamp = 0.85

    // Ambient color saturation: 0 = luminance only (grey), 1 = full sky color.
    // Lower values prevent the night-sky blue tint from spilling onto interior surfaces.
    ambientSaturation = 0.2


    // ── Scene Brightness Scale ──────────────────────────────────────────────
    //
    // A single brightness scale (0–1) is derived from raw sky luminance and
    // drives how much roads, fog, windows, and exterior lights dim at night.

    // Multiplier applied to raw sky luminance to produce the scene scale.
    // Higher values make the daytime ceiling sharper; lower values extend dusk.
    sceneScaleMultiplier = 5.0

    // Road and terrain _Color scale factor. envLuminance * roadMultiplier is
    // clamped to [0, 1], so surfaces dim toward zero at deep night.
    roadMultiplier = 2.0

    // Maximum road/terrain brightness at full daylight (0–1). Lower values
    // prevent overexposure when the sun is high. Default: 0.80.
    roadMax = 0.80


    // ── Shadow Caster ───────────────────────────────────────────────────────
    //
    // ERSV disables KSP's stock shadow lights and replaces them with a single
    // directional caster locked to the sun direction at cubemap capture time.

    // Intensity multiplier for the shadow caster light, as a fraction of the sun light's
    // intensity. 1.0 = full sun intensity; lower values soften shadow contrast.
    // Default: 0.5.
    shadowIntensity = 0.5

    // Horizontal (azimuth) rotation applied to the shadow direction in both
    // the VAB and SPH. Positive values rotate clockwise, negative counterclockwise.
    shadowAzimuthBias = 0.0

    // Additional horizontal (azimuth) rotation applied in the SPH only, on top
    // of shadowAzimuthBias. Negative values rotate counterclockwise.
    sphAzimuthBias = -60.0

    // VAB only: suppress shadows when the sun is within this many degrees of
    // zenith. The VAB ceiling has skylights so sunlight through the roof looks
    // correct. Set above 0 to suppress near-zenith shadows if preferred.
    vabRoofZenithCutoff = 0.0

    // Maximum distance (metres) from the camera at which shadows are rendered.
    // Unity's default is often 150–500 m, which causes shadows to vanish when
    // the camera is pulled back. Increase to see shadows across the full KSC
    // grounds. Very large values can reduce shadow map resolution quality.
    // Default: 2000.
    shadowDistance = 2000

    // Shadow map resolution for the ERSV shadow caster. Must be a power of 2.
    // 0 = use the global Quality Settings value. Higher values produce sharper
    // shadow edges at the cost of VRAM. 4096 is a good balance for the KSC scale.
    // Default: 4096.
    shadowResolution = 4096


    // ── Building Lights ─────────────────────────────────────────────────────

    // sceneScale threshold for interior building lights (baked emissives, floor
    // lights, spotlight flares). Below this value the scene is considered night
    // and the lights are switched on; at or above it they are switched off.
    // sceneScale is 0 at deep night and 1 at full daylight. Default: 0.5.
    interiorLightThreshold = 0.42

    // Emissive brightness of the window/skylight material at full daylight.
    // The color is taken from the sky cubemap so it tints with the sky (orange
    // at sunset, blue midday, etc.). Values above 1 are HDR and produce a
    // bloom-like glow. Default: 2.0.
    windowDayEmissive = 2.0

    // Emissive brightness of the window material at deep night.
    // A small non-zero value keeps the panes from going fully black.
    // Default: 0.05.
    windowNightEmissive = 0.05

    // Lights with a range above this value are treated as exterior spotlights
    // (crawlerway lamps, etc.) and have their range scaled at night. Lights at
    // or below this value are treated as interior building lights and are left
    // unchanged.
    exteriorRangeThreshold = 100.0

    // Exterior spotlight range scales toward this fraction of its original
    // range at deep night. Prevents beams from disappearing entirely.
    spillRangeFloor = 0.05

    // Maximum intensity multiplier for exterior spotlights at deep night,
    // compensating for reduced range so lit areas stay visible.
    exteriorBoostMax = 3.0

    // Window material albedo (_Color) scales to this fraction at deep night.
    // Window emission is always zeroed regardless of this value.
    windowAlbedoMin = 0.1


    // ── Capture ─────────────────────────────────────────────────────────────

    // Height in metres above the facility base from which the sky cubemap is captured.
    // If set below 90 m, also enable stripFacilityRenderers to prevent building
    // geometry from appearing in the cubemap.
    captureAltitude = 800

    // Disable VAB and SPH mesh renderers during capture. Only needed when
    // captureAltitude is below 90 m. Default: false.
    stripFacilityRenderers = false

    // Strip the Local Scenery layer from Camera 00 during capture. Recommended
    // for stock and most modded installs. Default: true.
    stripCam00LocalScenery = true

    // Number of border pixels on each face to replace with the nearest interior
    // pixel. Eliminates dark seam lines caused by the atmosphere not filling the
    // extreme edge of the 90-degree capture frustum. 0 = disabled. Default: 1.
    // Takes effect on next VAB/SPH switch without recapturing.
    edgeFixPixels = 4

    // Number of edge-smoothing passes applied to the cubemap after capture to
    // reduce seams at face boundaries. Higher values soften the seams more but
    // take longer. Default: 32.
    smoothEdgesIterations = 32

    // LensFlare brightness multiplier applied during sky capture when the player
    // was not facing the sun in the Space Centre scene. Increase if the sun looks
    // too small or dim in the captured cubemap. Range: 1–20. Default: 10.
    lensFlareMultiplier = 10


    // ── Debug ───────────────────────────────────────────────────────────────

    // Enable verbose logging to the KSP log for lighting and shadow events.
    debugLogging = false

    // Save each cubemap face as a PNG to <Mod folder>/SkyboxDebug/ after capture.
    saveFaceImages = false
}
